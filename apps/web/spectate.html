<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circleback · Spectate</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="spectate">
    <canvas id="stage"></canvas>

    <div id="spectate-hud">
      <aside id="join-card">
        <h1>Circleback</h1>
        <p class="tagline">Pets vs Bots · scan to join</p>
        <canvas id="qr" width="220" height="220"></canvas>
        <a id="join-url" target="_blank" rel="noopener"></a>
        <div id="room-code"></div>
        <div id="room-stats"></div>
      </aside>
      <ol id="spectate-board"></ol>
      <aside id="summon-card" hidden>
        <h2>Summon a rival</h2>
        <p id="summon-how">Paste any link in the game and a robot written from that page joins this arena.</p>
        <p id="summon-mail" hidden>Or email a link to <span class="inbox" id="summon-inbox"></span></p>
        <ol id="summon-feed"></ol>
      </aside>
      <div id="spectate-status" hidden></div>
    </div>

    <script type="module" src="/src/spectate.ts"></script>
  </body>
</html>
