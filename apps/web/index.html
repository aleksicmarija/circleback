<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Circleback · Pets vs Bots</title>
    <script>
      // Static hosts with an SPA fallback hand /spectate (an extension-less
      // path) to this page. Send it on to the spectator page before anything loads.
      if (/^\/spectate\/?$/.test(location.pathname)) {
        location.replace("/spectate.html" + location.search + location.hash);
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="menu" hidden></div>

    <div id="hud" hidden>
      <div id="top-left">
        <div id="room-info"></div>
        <button id="leave" class="secondary">Leave</button>
      </div>
      <ol id="leaderboard"></ol>
      <div id="score"></div>
      <div id="overlay" hidden></div>
      <div id="touch-hint" hidden>Swipe anywhere to steer</div>
    </div>

    <button id="mute" class="icon" title="Mute">🔊</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
