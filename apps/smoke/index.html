<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circleback smoke test</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem; max-width: 40rem; color: #222; background: #fafafa; }
      h1 { font-size: 1.2rem; }
      .row { display: flex; gap: 0.75rem; align-items: center; margin: 0.75rem 0; }
      .dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: #bbb; }
      .dot.ok { background: #2a2; }
      .dot.bad { background: #c33; }
      button { padding: 0.4rem 0.9rem; font: inherit; }
      table { border-collapse: collapse; width: 100%; }
      td, th { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
      code { background: #eee; padding: 0 0.25rem; }
      #log { color: #666; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Circleback — UI ⇄ Convex pipeline smoke test</h1>
    <p>Backend: <code id="url"></code></p>
    <div class="row"><span class="dot" id="ws"></span><span id="ws-text">connecting…</span></div>
    <div class="row">
      <button id="ping">Send ping</button>
      <span id="ack"></span>
    </div>
    <p>Latest pings (live subscription — open this page in two tabs, ping from one, watch the other):</p>
    <table>
      <thead><tr><th>sender</th><th>browser → server</th><th>server clock</th></tr></thead>
      <tbody id="pings"></tbody>
    </table>
    <p id="log"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
