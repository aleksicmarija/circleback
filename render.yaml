# Render Blueprint. Static sites only; Convex hosts the backend itself.
services:
  # The game. This ONE build command ships both halves: it pushes
  # packages/backend/convex/ to the Convex PRODUCTION deployment and builds the
  # client with that deployment's URL baked in.
  - type: web
    name: circleback-web
    runtime: static
    autoDeploy: false
    buildCommand: npm ci && npx convex deploy --cmd-url-env-var-name VITE_CONVEX_URL --cmd 'npm run build -w apps/web'
    staticPublishPath: apps/web/dist

    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - package-lock.json
        - render.yaml

    routes:
      # Order matters: Render applies the FIRST matching rule, and rules only
      # apply when no real file exists at the path. The spectator page is
      # built as spectate/index.html; this serves it at /spectate.
      - type: rewrite
        source: /spectate
        destination: /spectate/index.html
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Without this the client defaults to "local" -- an in-browser
      # simulation with no multiplayer at all.
      - key: VITE_BACKEND
        value: convex
      # Convex production deploy key. Render prompts for it; never commit it.
      - key: CONVEX_DEPLOY_KEY
        sync: false

  # Pipeline smoke test (apps/smoke). Points at the DEV Convex deployment, which
  # `npx convex dev` already pushed the functions to -- so this service needs no
  # deploy key and does not run `convex deploy`. It only builds the bundle.
  # Delete this service, apps/smoke/, smoke.ts and the smoke_pings table when done.
  - type: web
    name: circleback-smoke
    runtime: static
    autoDeploy: false
    buildCommand: npm ci && npm run build -w apps/smoke
    staticPublishPath: apps/smoke/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Not a secret: this URL is baked into the public JS bundle either way.
      - key: VITE_CONVEX_URL
        value: https://kindhearted-chipmunk-159.eu-west-1.convex.cloud
